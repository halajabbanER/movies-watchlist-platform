spring.application.name=movies-watchlist-platform

server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:movies}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:movies}
spring.datasource.password=${DB_PASSWORD:movies}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=true

tmdb.api.key=c8f6187e331ea655bb9bafe94dede1cb
tmdb.api.base-url=https://api.themoviedb.org/3