services:
  app:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace/${COMPOSE_PROJECT_NAME:-movies-watchlist-platform}
    command: mvn spring-boot:run
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: movies
      DB_USERNAME: movies
      DB_PASSWORD: movies
      MAVEN_CONFIG: /root/.m2
    volumes:
      - .:/workspace/${COMPOSE_PROJECT_NAME:-movies-watchlist-platform}
      - ${USERPROFILE:-~}/.m2:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: movies
      MYSQL_USER: movies
      MYSQL_PASSWORD: movies
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "movies", "-pmovies"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
